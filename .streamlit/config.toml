# Dashboard theme, matching the figures the pipeline renders so the hosted app
# and the report images read as one system.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false
