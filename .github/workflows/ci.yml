name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Check lint rules
        run: ruff check src tests api dashboard
      - name: Check formatting
        run: ruff format --check src tests api dashboard

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package
        run: pip install -e .
      - name: Run the test suite
        run: pytest --cov=returns_clv --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the package
        run: pip install -e .
      - name: Run the pipeline on a reduced budget
        # A smoke run: every stage executes and every artefact is written, with
        # a small search budget so CI stays under a few minutes.
        run: |
          returns-clv generate --out data/ci_dataset.csv --transactions 20000
          returns-clv validate --data data/ci_dataset.csv
          returns-clv eda --data data/ci_dataset.csv
          returns-clv train --data data/ci_dataset.csv --search-iterations 2
          returns-clv clv --data data/ci_dataset.csv
          returns-clv explain --data data/ci_dataset.csv
      - name: Check the expected artefacts exist
        run: |
          test -f models/return_risk_model.joblib
          test -f outputs/reports/training_summary.json
          test -f outputs/reports/customer_clv.csv
          test -f outputs/figures/01_roc_curves.png
      - name: Upload pipeline artefacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            outputs/reports/*.json
            outputs/figures/*.png
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t returns-clv:ci .
      - name: Start the container and check it reports healthy
        run: |
          docker run -d --name api -p 8000:8000 returns-clv:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          # With no model mounted the service must report degraded, not crash.
          curl -fsS http://localhost:8000/health | grep -q '"status"'
          docker rm -f api
